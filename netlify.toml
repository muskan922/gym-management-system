# Netlify configuration file
# This tells Netlify how to deploy your monorepo/subdirectory frontend structure.

[build]
  # The directory where the frontend code lives
  base = "frontend"
  
  # The command to build the project (run inside the base directory)
  command = "npm run build"
  
  # The directory to publish (relative to the base directory)
  publish = "dist"

# Proxy API requests to the live backend
[[redirects]]
  from = "/api/*"
  to = "https://gym-management-system-exow.onrender.com/api/:splat"
  status = 200
  force = true

# Rule to handle Single Page Application (SPA) routing redirects
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
